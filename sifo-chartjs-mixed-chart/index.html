<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIFO Chart.js Mixed Chart</title>
    <script src="../tableau.extensions.1.latest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body onload="initialize()" class="m-0 h-screen bg-white font-[Calibri,Arial,sans-serif]" style="--accent: #1f4e79;">
    <main class="flex h-full min-h-0 flex-col p-3">
        <section id="resultBox" class="flex-1 min-h-0 overflow-hidden" aria-live="polite">
            <div id="chartContainer" class="relative h-full min-h-56 w-full rounded-lg border border-gray-200 bg-gray-50 p-3">
                <canvas id="mainChart" role="img" aria-label="SIFO productivity comparison chart"></canvas>
            </div>
        </section>
        <section id="controls" class="mt-3 hidden items-center justify-between border-t border-gray-200 pt-2">
            <span id="rangeLabel" class="text-xs font-medium uppercase tracking-wide text-gray-500"></span>
            <span id="rowLabel" class="text-xs text-gray-400"></span>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
