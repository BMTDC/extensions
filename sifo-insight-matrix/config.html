<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIFO Insight settings</title><link rel="stylesheet" href="styles.css"><script src="https://extensions.tableauusercontent.com/resources/tableau.extensions.1.latest.min.js"></script><script src="config.js" defer></script></head><body><main class="app"><section class="panel"><p class="eyebrow">SIFO INSIGHT MATRIX</p><h1>Settings</h1><p class="scope">Tune the target and performance thresholds without changing the workbook.</p><form id="form" class="rows" style="margin-top:18px"><label>Warning threshold (%)<input id="warningPct" type="number" min="1" max="100" step="1" required></label><label>Good threshold (%)<input id="goodPct" type="number" min="1" max="200" step="1" required></label><label>Productivity target<input id="defaultTarget" type="number" min="0.01" step="0.01" required></label><label>Decimal places<select id="numberDecimals"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label><p id="message" role="alert" class="scope"></p><div class="toolbar" style="justify-content:flex-start"><button type="submit" style="height:38px;border:0;border-radius:8px;padding:0 16px;background:#ef7d00;color:#fff;font-weight:700">Save</button><button id="reset" type="button" style="height:38px;border:1px solid #e6e9ed;border-radius:8px;padding:0 16px;background:#fff">Reset</button><button id="cancel" type="button" style="height:38px;border:1px solid #e6e9ed;border-radius:8px;padding:0 16px;background:#fff">Cancel</button></div></form></section></main></body></html>
